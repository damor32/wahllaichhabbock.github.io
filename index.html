<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wahlla ich hab bock</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF3366;
            --secondary: #FFD700;
            --accent: #00FFA3;
            --dark: #0A0E27;
            --light: #F8F9FA;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #000000;
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background-image: url('RENDER_3.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: contrast(1.2) brightness(1.1);
        }

        .bg-animation::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                transparent 0%, 
                transparent 20%,
                rgba(0, 0, 0, 0.2) 35%,
                rgba(0, 0, 0, 0.5) 50%,
                rgba(0, 0, 0, 0.8) 65%,
                rgba(0, 0, 0, 0.95) 80%,
                #000000 100%);
            z-index: 1;
        }

        body::before {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70vh;
            background: linear-gradient(to top, 
                #000000 0%, 
                #000000 20%,
                rgba(0, 0, 0, 0.9) 40%,
                rgba(0, 0, 0, 0.6) 60%,
                transparent 100%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 680px;
            margin: 0 auto;
            padding: 60px 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 1s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-img {
            width: 200px;
            height: 200px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
            object-fit: contain;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--secondary), var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            text-transform: lowercase;
        }

        .bio {
            font-size: 1.1rem;
            color: rgba(248, 249, 250, 0.7);
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Links Section */
        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-item {
            position: relative;
            text-decoration: none;
            color: var(--light);
            padding: 22px 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            overflow: hidden;
            animation: slideIn 0.6s ease-out backwards;
        }

        .link-item:nth-child(1) { animation-delay: 0.1s; }
        .link-item:nth-child(2) { animation-delay: 0.2s; }
        .link-item:nth-child(3) { animation-delay: 0.3s; }
        .link-item:nth-child(4) { animation-delay: 0.4s; }
        .link-item:nth-child(5) { animation-delay: 0.5s; }
        .link-item:nth-child(6) { animation-delay: 0.6s; }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.4s ease;
            z-index: -1;
        }

        .link-item:hover {
            transform: translateX(10px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 10px 40px rgba(0, 255, 163, 0.3);
        }

        .link-item:hover::before {
            width: 100%;
        }

        .link-icon {
            font-size: 1.8rem;
            min-width: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-text {
            flex: 1;
        }

        .link-arrow {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .link-item:hover .link-arrow {
            transform: translateX(8px);
        }

        /* Gallery Section */
        .gallery-section {
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out 0.5s backwards;
        }

        .gallery-title {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 200px);
            gap: 15px;
            position: relative;
        }

        .gallery-grid::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            right: -30px;
            bottom: -30px;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 51, 102, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 163, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.15) 0%, transparent 50%);
            filter: blur(60px);
            z-index: -1;
            opacity: 0.7;
            animation: pulseGlow 5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.5;
                transform: scale(0.95);
            }
            100% {
                opacity: 0.9;
                transform: scale(1.05);
            }
        }

        .gallery-large {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }

        .gallery-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                rgba(255, 51, 102, 0.3) 0%, 
                rgba(0, 255, 163, 0.3) 50%,
                rgba(255, 215, 0, 0.3) 100%);
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 2;
            mix-blend-mode: overlay;
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            inset: -100%;
            background: conic-gradient(from 0deg, 
                transparent 0deg, 
                rgba(0, 255, 163, 0.4) 90deg, 
                transparent 180deg,
                rgba(255, 51, 102, 0.4) 270deg,
                transparent 360deg);
            opacity: 0;
            transition: all 0.6s ease;
            z-index: 1;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            mix-blend-mode: luminosity;
            opacity: 0.75;
            filter: contrast(1.15) brightness(1.05) grayscale(30%);
        }

        .gallery-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 3;
        }

        .gallery-label {
            font-family: 'Syne', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transform: translateY(20px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gallery-item:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(0, 255, 163, 0.5);
            box-shadow: 
                0 25px 70px rgba(0, 255, 163, 0.25),
                0 0 100px rgba(255, 51, 102, 0.15),
                inset 0 0 80px rgba(255, 255, 255, 0.03);
            z-index: 10;
        }

        .gallery-item:hover::before {
            opacity: 1;
        }

        .gallery-item:hover::after {
            opacity: 1;
            animation: rotateGradient 3s linear infinite;
        }

        @keyframes rotateGradient {
            to {
                transform: rotate(360deg);
            }
        }

        .gallery-item:hover img {
            transform: scale(1.15) rotate(2deg);
            opacity: 1;
            mix-blend-mode: normal;
            filter: contrast(1.25) brightness(1.15) saturate(1.4) grayscale(0%);
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-item:hover .gallery-label {
            transform: translateY(0);
        }

        /* Staggered Animations */
        .gallery-item:nth-child(1) {
            animation: scaleIn 0.8s ease-out 0.6s backwards;
        }

        .gallery-item:nth-child(2) {
            animation: slideInRight 0.8s ease-out 0.8s backwards;
        }

        .gallery-item:nth-child(3) {
            animation: slideInRight 0.8s ease-out 1s backwards;
        }

        .gallery-item:nth-child(4) {
            animation: slideInLeft 0.8s ease-out 1.2s backwards;
        }

        .gallery-item:nth-child(5) {
            animation: slideInLeft 0.8s ease-out 1.4s backwards;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(-5deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .gallery-item-wide {
            grid-column: 1 / -1;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotate(0deg);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px) rotate(10deg);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotate(0deg);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(100px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Lightbox for Images */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            position: relative;
            animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lightbox-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 80px rgba(0, 255, 163, 0.3);
        }

        .lightbox-close {
            position: absolute;
            top: -50px;
            right: 0;
            font-size: 40px;
            color: white;
            background: rgba(255, 51, 102, 0.8);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 300;
            line-height: 1;
        }

        .lightbox-close:hover {
            background: var(--primary);
            transform: rotate(90deg);
        }

        @media (max-width: 768px) {
            .lightbox-close {
                top: 20px;
                right: 20px;
                font-size: 30px;
                width: 40px;
                height: 40px;
            }
        }

        /* Music Player Section */
        .music-section {
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out 1.6s backwards;
        }

        .music-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .track-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            backdrop-filter: blur(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .track-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(0, 255, 163, 0.2));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .track-item:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 163, 0.5);
            box-shadow: 0 15px 40px rgba(0, 255, 163, 0.2);
        }

        .track-item:hover::before {
            opacity: 1;
        }

        .track-item.playing {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(0, 255, 163, 0.4);
        }

        .track-cover {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
            background: rgba(0, 0, 0, 0.3);
        }

        .track-cover img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 20px;
            opacity: 0.8;
            transition: all 0.4s ease;
        }

        .track-item:hover .track-cover img {
            opacity: 1;
            transform: scale(1.1);
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 255, 163, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--dark);
            z-index: 2;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .track-item:hover .play-button {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .track-item.playing .play-button {
            opacity: 1;
            background: var(--primary);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .track-info {
            position: relative;
            z-index: 1;
        }

        .track-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--light);
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.9rem;
            color: rgba(248, 249, 250, 0.6);
        }

        /* Spotify Section */
        .spotify-section {
            margin-top: 40px;
        }

        .spotify-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: var(--light);
        }

        .spotify-embeds {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .spotify-embeds iframe {
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .spotify-embeds iframe:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 255, 163, 0.3);
        }

        /* Responsive Music */
        @media (max-width: 768px) {
            .music-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            color: rgba(248, 249, 250, 0.5);
            font-size: 0.95rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                font-size: 16px;
            }

            .container {
                padding: 30px 15px;
            }

            h1 {
                font-size: 2rem;
                line-height: 1.1;
            }

            .bio {
                font-size: 1rem;
                padding: 0 10px;
            }

            .profile-img {
                width: 140px;
                height: 140px;
            }

            .profile {
                margin-bottom: 35px;
            }

            /* Gallery Mobile */
            .gallery-section {
                margin-bottom: 35px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
                gap: 10px;
            }

            .gallery-large {
                grid-column: 1 / -1;
                grid-row: auto;
                aspect-ratio: 16/9;
            }

            .gallery-item {
                aspect-ratio: 1;
                border-radius: 12px;
            }

            .gallery-label {
                font-size: 0.85rem;
                letter-spacing: 1px;
            }

            .gallery-overlay {
                padding: 12px;
            }

            .gallery-item:hover {
                transform: scale(1.02);
            }

            /* Music Mobile */
            .music-section {
                margin-bottom: 35px;
            }

            .music-title {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .spotify-embeds {
                gap: 12px;
            }

            .spotify-embeds iframe {
                height: 152px;
            }

            /* Links Mobile */
            .links {
                gap: 12px;
            }

            .link-item {
                padding: 16px 20px;
                font-size: 1rem;
                border-radius: 16px;
            }

            .link-icon {
                font-size: 1.5rem;
                min-width: 30px;
            }

            .link-arrow {
                font-size: 1.1rem;
            }

            /* Disable cursor glow on mobile */
            .cursor-glow {
                display: none;
            }

            /* Footer Mobile */
            footer {
                margin-top: 40px;
                padding: 20px;
                font-size: 0.85rem;
            }
        }

        /* Extra small screens */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .profile-img {
                width: 120px;
                height: 120px;
            }

            .gallery-grid {
                gap: 8px;
            }

            .link-item {
                padding: 14px 18px;
                font-size: 0.95rem;
            }

            .spotify-embeds {
                gap: 10px;
            }
        }

        /* Custom Cursor Effect */
        .cursor-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 51, 102, 0.15) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        /* Background Music Control */
        .bg-music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .music-toggle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 24px;
        }

        .music-toggle-btn:hover {
            background: rgba(0, 255, 163, 0.2);
            border-color: var(--accent);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 255, 163, 0.4);
        }

        .music-toggle-btn.muted {
            opacity: 0.5;
        }

        .music-toggle-btn.playing {
            animation: musicPulse 1.5s ease-in-out infinite;
        }

        @keyframes musicPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(0, 255, 163, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(0, 255, 163, 0);
            }

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            currentX += (mouseX - currentX) * 0.1;
            currentY += (mouseY - currentY) * 0.1;
            cursorGlow.style.left = currentX + 'px';
            cursorGlow.style.top = currentY + 'px';
            requestAnimationFrame(animate);
        }
        animate();

        // Link clicks with animation
        document.querySelectorAll('.link-item').forEach(link => {

                }, 150);
            });
        });

        const bgMusic = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');
        const musicIcon = document.querySelector('.music-icon');
        let isMuted = false;

        // Try to autoplay music when page loads
        window.addEventListener('load', () => {
            // Try to play music
            const playPromise = bgMusic.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Autoplay started successfully
                    musicToggle.classList.add('playing');
                    musicIcon.textContent = '🔊';
                }).catch(error => {
                    // Autoplay was prevented - show muted state
                    console.log('Autoplay prevented, user needs to interact first');
                    musicToggle.classList.add('muted');
                    musicIcon.textContent = '🔇';
                    isMuted = true;
                });
            }
        });

        // Toggle music on/off
        musicToggle.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                musicToggle.classList.add('playing');
                musicToggle.classList.remove('muted');
                musicIcon.textContent = '🔊';
                isMuted = false;
            } else {
                bgMusic.pause();
                musicToggle.classList.remove('playing');
                musicToggle.classList.add('muted');
                musicIcon.textContent = '🔇';
                isMuted = true;
            }
        });

                    lightbox.classList.add('active');

            });
        });

        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // Close on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // Re-enable scrolling
        }
